[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["C90", "E4", "E7", "E9", "F"]

[tool.ruff.lint.mccabe]
max-complexity = 13

[tool.ruff.lint.per-file-ignores]
"tests/test_activation.py" = ["E402"]
"tests/test_nvd.py" = ["E402"]

[tool.basedpyright]
include = ["src/lib"]
extraPaths = ["src/lib"]
exclude = ["tests"]
ignore = ["tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
