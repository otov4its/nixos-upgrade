[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_activation.py" = ["E402"]
"tests/test_nvd.py" = ["E402"]

[tool.basedpyright]
include = ["src/lib"]
extraPaths = ["src/lib"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
